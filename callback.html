<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>GSync sign-in return</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5fa;color:#202033;font:16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif}
main{max-width:450px;padding:30px;text-align:center;background:white;border:1px solid #e3e1ec;border-radius:18px;margin:18px}
h1{font-size:1.5rem}p{color:#63657a}.btn{display:inline-block;background:#6940b6;color:white;padding:10px 18px;border-radius:10px;text-decoration:none;font-weight:650}
.hidden{display:none}small{font-size:.8rem}
</style>
</head>
<body><main>
<h1 id="title">Returning to Obsidian…</h1>
<p id="message">If Obsidian does not open automatically, select the button below.</p>
<a id="open-obsidian" class="btn" href="#">Open Obsidian</a>
<p><small>This page redirects Google's one-time authorization response to the local GSync plugin. It does not store your notes.</small></p>
</main>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(window.location.search);
  var code = params.get('code');
  var state = params.get('state') || '';
  var error = params.get('error');
  var heading = document.getElementById('title');
  var message = document.getElementById('message');
  var button = document.getElementById('open-obsidian');
  if (!code && !error) {
    heading.textContent = 'GSync sign-in';
    message.textContent = 'Start signing in from the GSync settings inside Obsidian.';
    button.classList.add('hidden');
    return;
  }
  var vault = '';
  var marker = state.indexOf('~');
  if (marker !== -1) {
    try {
      var b64 = state.substring(marker + 1).replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      var bytestr = atob(b64);
      var bytes = new Uint8Array(bytestr.length);
      for (var j = 0; j < bytestr.length; j++) bytes[j] = bytestr.charCodeAt(j);
      vault = new TextDecoder().decode(bytes);
    } catch (ignore) { vault = ''; }
  }
  var next = new URLSearchParams();
  if (vault) next.set('vault', vault);
  if (code) next.set('code', code);
  if (state) next.set('state', state);
  if (error) next.set('error', error);
  var redirect = 'obsidian://gsync-auth?' + next.toString();
  button.href = redirect;
  if (error) {
    heading.textContent = 'Sign-in cancelled';
    message.textContent = 'Google returned: ' + error + '. Return to Obsidian and try again.';
  }
  // Do not leave one-time OAuth codes in the browser history/address bar.
  try { window.history.replaceState(null, '', window.location.pathname); } catch (ignore) {}
  window.setTimeout(function () { window.location.href = redirect; }, 300);
})();
</script></body></html>
